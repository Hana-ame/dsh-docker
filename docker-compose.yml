services:
  dsh:
    build:
      context: .
      dockerfile: Dockerfile
    image: dsh:latest
    container_name: dsh-sandbox
    restart: unless-stopped
    ports:
      - "${HOST_BIND:-0.0.0.0}:${HOST_PORT:-8080}:3080"
    environment:
      - NODE_ENV=production
      - DSH_HOME=/home/dshuser/.dsh
      - HOST_PORT=${HOST_PORT:-8080}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - EXTRA_TRUSTED_HOSTS=${EXTRA_TRUSTED_HOSTS:-}
    volumes:
      - dsh_data:/home/dshuser/.dsh
      - dsh_workspace:/workspace
    # In-memory tmpfs for /tmp: fast I/O and auto-cleaned on restart
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1g
    # Host isolation & security hardening
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    extra_hosts:
      - "host.docker.internal:127.0.0.1"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
          pids: 256
    networks:
      dsh-network:
        ipv4_address: 172.28.0.10

networks:
  dsh-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1

volumes:
  dsh_data:
    name: dsh_data
  dsh_workspace:
    name: dsh_workspace
